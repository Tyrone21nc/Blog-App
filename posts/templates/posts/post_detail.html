<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }} - My Django Blog</title>
    <!-- Tailwind CSS CDN for modern UI -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

    <!-- Navigation Header -->
    <header class="bg-white shadow-sm border-b border-gray-200 py-6 mb-8">
        <div class="max-w-3xl mx-auto px-4">
            <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">
                <a href="{% url 'post_list' %}" class="hover:text-indigo-600 transition">My Django Blog</a>
            </h1>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-3xl mx-auto px-4 pb-16">
        
        <!-- Back Button -->
        <div class="mb-6">
            <a href="{% url 'post_list' %}" class="inline-flex items-center text-sm font-semibold text-indigo-600 hover:text-indigo-800 transition">
                &larr; Back to all posts
            </a>
        </div>

        <!-- Post Detail Article Card -->
        <article class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 sm:p-10">
            
            <!-- Post Title -->
            <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 mb-4 leading-tight">
                {{ post.title }}
            </h1>
            
            <!-- Metadata (Author & Date) -->
            <div class="flex items-center text-sm text-gray-500 mb-8 pb-6 border-b border-gray-100 space-x-2">
                <span class="font-medium text-gray-700">Published by {{ post.author }}</span>
                <span>&bull;</span>
                <time datetime="{{ post.created_at }}">{{ post.created_at }}</time>
            </div>

            <!-- Full Body Text -->
            <div class="text-gray-700 text-lg leading-relaxed whitespace-pre-line space-y-4">
                {{ post.body }}
            </div>

        </article>

    </main>

</body>
</html>
